{% extends "base.html" %}
{% block title %}Team {{ team }}{% endblock %}
{% block content %}
<h1 class="h3">Team {{ team }}</h1>
<p class="mb-1">Team members:</p>
<ul>
  {% for nickname in members %}<li>{{ nickname }}</li>{% endfor %}
</ul>
<form method="post">
  {% csrf_token %}
  <button id="abtest" class="btn btn-primary btn-lg" type="submit">{{ variant }}</button>
</form>
{% endblock %}
