{% extends "base.html" %}
{% load static %}
{% block title %}Log in · Yale Shuttle{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="card auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <img src="{% static 'core/favicon.svg' %}" alt="" width="48" height="48" class="mb-3">
          <h1 class="h3 mb-1">Welcome back</h1>
          <p class="text-body-secondary mb-0">Log in to Yale Shuttle</p>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "registration/_fields.html" %}
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Log in</button>
        </form>
      </div>
    </div>
    <p class="text-center mt-3">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
