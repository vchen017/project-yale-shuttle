{% extends "base.html" %}
{% load static %}
{% block title %}Sign up · Yale Shuttle{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="card auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <img src="{% static 'core/favicon.svg' %}" alt="" width="48" height="48" class="mb-3">
          <h1 class="h3 mb-1">Create your account</h1>
          <p class="text-body-secondary mb-0">It takes less than a minute.</p>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "registration/_fields.html" %}
          <button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Sign up</button>
        </form>
      </div>
    </div>
    <p class="text-center mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
