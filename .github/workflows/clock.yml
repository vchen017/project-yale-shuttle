name: job clock

# GitHub starts scheduled runs hours late or not at all, so this keeps time for
# the scheduled jobs instead (#40), the way downtowner-recorder keeps its polls
# on time. Each run stays up about 5 hours: in each minute that a cron line in
# jobs.yml fires, jobs/clock.py starts a "scheduled jobs" run for that line.
# Then this queues the next clock run, which starts as this one ends, when no
# job is due for 15 minutes. It never touches the database.
#
# The cron below is a backup in case the chain breaks: GitHub starts it late
# too, but it gets the clock going again. The concurrency group keeps at most
# one clock running and one waiting. To start it by hand: Actions → job clock
# → Run workflow. To stop it: disable this workflow, then cancel its run.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: job-clock
  cancel-in-progress: false

permissions:
  actions: write  # to start "scheduled jobs" runs and the next clock run
  contents: read

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Start each job on time
        run: python3 jobs/clock.py --minutes 290
      # Even after a start failed, so the clock keeps going; but not when
      # someone cancelled this run.
      - name: Queue the next clock run
        if: ${{ !cancelled() }}
        run: gh workflow run clock.yml --ref main
