name: ci

# Lints the code and runs the tests against PostgreSQL on every pull request
# and push to main. Branch protection requires this job, so a lint error or a
# failing test blocks the merge. The tests include the browser test (e2e/,
# #160), in headless Chromium: E2E=1 makes it fail, rather than skip, without
# its browser or the CDN files it serves the page.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SECRET_KEY: only-for-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install headless Chromium for the browser test
        run: python -m playwright install --with-deps chromium-headless-shell
      - name: Fetch the CDN files the browser test serves, checked against the hashes the templates pin
        run: python -m e2e.assets
      - name: Lint (run `ruff check --fix .` to fix most of these)
        run: ruff check --output-format github .
      - name: Check that every model change has a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Apply every migration to an empty PostgreSQL database
        run: python manage.py migrate --no-input && python manage.py migrate --check
      - run: python manage.py test
        env:
          E2E: "1"
