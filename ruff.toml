# Ruff, our linter (issue #38). CI runs `ruff check .` and blocks the merge if
# it fails. Run `ruff check --fix .` before you push.
#
# The rules catch real mistakes rather than style: syntax errors, undefined or
# unused names, unused imports, import order, and Django model pitfalls. We
# don't run the formatter, so nobody's open pull request gets reformatted.
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[lint]
select = [
  "E4", "E7", "E9",  # import placement, statements, syntax errors
  "F",               # Pyflakes: undefined names, unused imports and variables
  "I",               # import order
  "DJ",              # Django: model and form pitfalls
]
